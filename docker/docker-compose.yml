services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    # Same tag pre:docker builds, so `bun run docker:up` can reuse it instead of
    # starting a second, unbounded build. The build block stays for anyone who
    # prefers `docker compose build` directly.
    image: crm-api:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["bun", "dist/server.js"]
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crm
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: dev-session-secret-change-in-production
      CORS_ORIGIN: http://localhost:5173
      STORAGE_DIR: /tmp/storage
    # Uses bun's fetch, so the image needs no extra tool (curl is not in the
    # base image). With this, `docker compose up --wait` fails instead of
    # reporting success for a container that died on startup.
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  postgres_data:
  redis_data:

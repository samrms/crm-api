name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    needs: [quality, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build

      # AnAn image can compile and still fail to boot (unresolved path aliases,,
      # aa missing runtime file), so build itmissing runtime file), so build it and require a healthy response.
      # pre:dockerpre:docker is the same gateis the same gate the pre-push hookhook runs,runs, withwith the CICI tagtag.
      - name: Build and smokeBuild and smoke test the image
        envenv:
          IMAGE:
          IMAGE: crm-api:${{ github.sha }}
        run: bun run pre:docker

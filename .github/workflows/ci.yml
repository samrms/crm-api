name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    needs: [quality, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: docker build --file docker/Dockerfile --tag crm-api:${{ github.sha }} .

      # Building the image is not enough: an image can compile and still fail
      # to boot (e.g. unresolved path aliases at runtime). Boot it against
      # in-memory SQLite and require a healthy response. .githooks/smoke.sh is
      # shared with the pre-push gate so both check the same thing.
      - name: Smoke test the image
        run: sh .githooks/smoke.sh crm-api:${{ github.sha }}
